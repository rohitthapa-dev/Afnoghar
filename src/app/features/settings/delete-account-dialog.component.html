<div class="dialog-container">
  <div class="dialog-header">
    <div class="warning-icon-wrapper">
      <mat-icon>warning</mat-icon>
    </div>
    <h2>Delete Account</h2>
    <button class="close-btn" (click)="cancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="dialog-body">
    <p class="dialog-message">
      This action is <strong>permanent</strong> and cannot be undone.
      All your data, including favorites and property listings, will be removed.
    </p>

    <div class="confirmation-block">
      <p class="confirmation-label">
        Type <strong>DELETE</strong> to confirm:
      </p>
      <mat-form-field appearance="outline" class="confirmation-field">
        <input
          matInput
          [(ngModel)]="confirmationText"
          placeholder="Type DELETE here"
          autocomplete="off"
        />
      </mat-form-field>
    </div>
  </div>

  <div class="dialog-actions">
    <button
      mat-stroked-button
      class="cancel-dialog-btn"
      (click)="cancel()"
    >
      Cancel
    </button>
    <button
      mat-flat-button
      class="delete-dialog-btn"
      [disabled]="!isConfirmed"
      (click)="confirm()"
    >
      <mat-icon>delete_forever</mat-icon>
      Delete Account
    </button>
  </div>
</div>
